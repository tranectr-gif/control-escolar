<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10243a">
<meta name="description" content="Control escolar para clases de Física">
<link rel="manifest" href="manifest.webmanifest">
<title>Control Escolar Física</title>
<style>
:root{--navy:#10243a;--blue:#2463eb;--bg:#f3f6fa;--card:#fff;--ink:#172334;--muted:#64748b;--line:#e4eaf1;--red:#dc2626;--green:#15803d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:84px}.top{background:var(--navy);color:#fff;padding:20px 18px 24px;border-radius:0 0 22px 22px}.toprow{display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;letter-spacing:1.5px;color:#b9c8d8;font-weight:700}.top h1{margin:6px 0 2px;font-size:25px}.top p{margin:0;color:#cbd5e1;font-size:13px}.pill{background:#203c58;border:1px solid #38536d;padding:6px 10px;border-radius:99px;font-size:11px}.content{padding:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}.sectionhead h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 2px 8px #0f172a08}.tile{min-height:112px;text-align:left;color:var(--ink)}.tile .ico{font-size:24px}.tile b{display:block;margin-top:9px;font-size:14px}.tile small{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);padding:12px;border-radius:14px}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--blue);color:white;font-weight:650}.btn.secondary{background:#eaf0ff;color:#1d4ed8}.btn.ghost{background:#f1f5f9;color:#334155}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:7px 10px;font-size:12px}.btn.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d7e0ea;border-radius:10px;background:white;color:var(--ink);outline:none}.field textarea{min-height:72px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item strong{display:block}.item small{color:var(--muted)}.avatar{width:39px;height:39px;border-radius:12px;background:#eaf0ff;color:#1d4ed8;display:grid;place-items:center;font-weight:800;flex:none}.itemmain{display:flex;gap:10px;align-items:center;min-width:0}.itemmain>div:last-child{min-width:0}.itemmain strong{overflow-wrap:anywhere}.empty{text-align:center;padding:28px 14px;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:14px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));}.navinner{width:min(900px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{border:0;background:transparent;color:#64748b;padding:6px 2px;border-radius:10px;font-size:10px}.nav button.active{color:#1d4ed8;background:#eff6ff}.nav span{display:block;font-size:19px;margin-bottom:2px}.hidden{display:none!important}.back{border:0;background:transparent;color:#2563eb;padding:0 0 12px;font-weight:700}.qrbox{text-align:center;padding:15px;background:#fff;border-radius:14px;border:1px solid var(--line)}#reader{width:100%;max-width:420px;margin:12px auto;border-radius:12px;overflow:hidden}table{border-collapse:collapse;width:100%;font-size:13px;background:white}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:#64748b;background:#f8fafc;font-size:11px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.grade-low{color:#b91c1c;font-weight:800}.grade-ok{color:#15803d;font-weight:800}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:11px;font-size:13px;margin:10px 0}.modalbg{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:16px;z-index:30}.modal{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:18px}.modal h3{margin:0 0 10px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#10243a;color:white;padding:10px 15px;border-radius:99px;z-index:50;font-size:13px;box-shadow:0 5px 20px #0003}.tiny{font-size:11px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.content{padding:24px}.top{padding:24px 26px 28px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="app">
<header class="top">
 <div class="toprow"><div class="brand">HERRAMIENTA DOCENTE</div><span class="pill">CICLO 2026–2027</span></div>
 <h1>Control Escolar Física</h1><p>Administración de grupos y evaluaciones</p>
</header>
<main class="content" id="view"></main>
</div>
<nav class="nav"><div class="navinner">
<button data-tab="home" class="active"><span>⌂</span>Inicio</button>
<button data-tab="students"><span>♙</span>Alumnos</button>
<button data-tab="scan"><span>▦</span>Escanear</button>
<button data-tab="grades"><span>✓</span>Calificar</button>
</div></nav>
<div id="modalroot"></div><div id="toastroot"></div>
<script>
const KEY='cef_data_v1';
const defaults={groups:['2°D','2°E','2°F'],students:[],activities:[],grades:[],history:[],weights:{'Libreta':20,'Tareas':15,'Proyectos':20,'Actividades en clase':15,'Exámenes':25,'Participación':5},term:'1'};
let db=load();let currentTab='home';let stream=null;let selectedStudent=null;
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let r=document.getElementById('toastroot');r.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>r.innerHTML='',2500)}
function nav(t){currentTab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function render(){stopCamera();let v=document.getElementById('view');({home:home,students:studentsPage,groups:groupsPage,scan:scanPage,grades:gradesPage,activities:activitiesPage,reports:reportsPage,settings:settingsPage,student:studentPage})[currentTab]?.(v)}
function home(v){v.innerHTML=`<div class="sectionhead"><div><h2>Panel principal</h2><div class="muted">Resumen de tu control escolar</div></div><button class="btn small secondary" onclick="nav('settings')">⚙ Ajustes</button></div>
<div class="stats"><div class="stat"><strong>${db.groups.length}</strong><span>GRUPOS</span></div><div class="stat"><strong>${db.students.length}</strong><span>ALUMNOS</span></div><div class="stat"><strong>${db.grades.length}</strong><span>CALIFICACIONES</span></div></div>
<div class="grid">
<button class="tile" onclick="nav('groups')"><div class="ico">🏫</div><b>Mis grupos</b><small>Administrar grupos</small></button>
<button class="tile" onclick="nav('students')"><div class="ico">👥</div><b>Registrar alumnos</b><small>Altas, bajas y QR</small></button>
<button class="tile" onclick="nav('scan')"><div class="ico">▦</div><b>Escanear QR</b><small>Identificar alumno</small></button>
<button class="tile" onclick="nav('activities')"><div class="ico">📝</div><b>Administrar tareas</b><small>Crear actividades</small></button>
<button class="tile" onclick="nav('grades')"><div class="ico">✍️</div><b>Registrar calificaciones</b><small>Evaluar actividades</small></button>
<button class="tile" onclick="nav('reports')"><div class="ico">📊</div><b>Consultar reportes</b><small>Promedios y resultados</small></button>
</div><div class="card" style="margin-top:14px"><b>Acceso rápido</b><p class="muted">Selecciona un grupo para comenzar a trabajar.</p><div class="actions">${db.groups.map(g=>`<button class="btn secondary small" onclick="openGroup('${esc(g)}')">${esc(g)}</button>`).join('')}</div></div>`}
function openGroup(g){nav('students');document.getElementById('filterGroup').value=g;renderStudentList()}
function groupsPage(v){v.innerHTML=`<button class="back" onclick="nav('home')">← Inicio</button><div class="sectionhead"><h2>Mis grupos</h2><button class="btn small" onclick="groupModal()">＋ Agregar</button></div><div class="list">${db.groups.map(g=>`<div class="item"><div class="itemmain"><div class="avatar">🏫</div><div><strong>${esc(g)}</strong><small>${db.students.filter(s=>s.group===g).length} alumnos</small></div></div><div class="actions"><button class="btn small secondary" onclick="renameGroup('${esc(g)}')">Editar</button><button class="btn small danger" onclick="deleteGroup('${esc(g)}')">×</button></div></div>`).join('')||'<div class="empty">Aún no hay grupos.</div>'}</div>`}
function groupModal(old=''){modal(`<h3>${old?'Editar':'Agregar'} grupo</h3><div class="field"><label>Nombre del grupo</label><input id="gname" value="${esc(old)}" placeholder="Ej. 2°G"></div><div class="actions"><button class="btn" onclick="saveGroup('${esc(old)}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveGroup(old){let n=document.getElementById('gname').value.trim();if(!n)return toast('Escribe el nombre del grupo');if(db.groups.includes(n)&&n!==old)return toast('Ese grupo ya existe');if(old){db.groups[db.groups.indexOf(old)]=n;db.students.forEach(s=>{if(s.group===old)s.group=n})}else db.groups.push(n);save();closeModal();render()}
function renameGroup(g){groupModal(g)}function deleteGroup(g){if(db.students.some(s=>s.group===g))return toast('Primero cambia o elimina sus alumnos');if(confirm('¿Eliminar el grupo '+g+'?')){db.groups=db.groups.filter(x=>x!==g);save();render()}}
function studentsPage(v){v.innerHTML=`<button class="back" onclick="nav('home')">← Inicio</button><div class="sectionhead"><h2>Alumnos</h2><button class="btn small" onclick="studentModal()">＋ Registrar</button></div><div class="field"><label>Filtrar por grupo</label><select id="filterGroup" onchange="renderStudentList()"><option value="">Todos los grupos</option>${db.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div id="studentlist"></div>`;renderStudentList()}
function renderStudentList(){let f=document.getElementById('filterGroup')?.value||'';let arr=db.students.filter(s=>!f||s.group===f).sort((a,b)=>a.group.localeCompare(b.group)||a.number-b.number);document.getElementById('studentlist').innerHTML=arr.length?`<div class="list">${arr.map(s=>`<div class="item"><div class="itemmain" onclick="showStudent('${s.id}')"><div class="avatar">${s.number}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.group)} · Lista ${s.number}</small></div></div><div class="actions"><button class="btn small secondary" onclick="showStudent('${s.id}')">Ver</button><button class="btn small ghost" onclick="studentModal('${s.id}')">✎</button></div></div>`).join('')}</div>`:'<div class="empty">No hay alumnos en este grupo. Registra el primero con el botón superior.</div>'}
function studentModal(id=''){let s=db.students.find(x=>x.id===id)||{};modal(`<h3>${id?'Editar alumno':'Registrar alumno'}</h3><div class="field"><label>Nombre completo</label><input id="sname" value="${esc(s.name||'')}" placeholder="Nombre y apellidos"></div><div class="row"><div class="field"><label>Número de lista</label><input id="snum" type="number" min="1" value="${s.number||''}"></div><div class="field"><label>Grupo</label><select id="sgroup">${db.groups.map(g=>`<option ${s.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div></div><div class="actions"><button class="btn" onclick="saveStudent('${id}')">Guardar alumno</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveStudent(id){let name=document.getElementById('sname').value.trim(),number=Number(document.getElementById('snum').value),group=document.getElementById('sgroup').value;if(!name||!number||!group)return toast('Completa todos los campos');if(db.students.some(s=>s.id!==id&&s.group===group&&s.number===number))return toast('Ya existe ese número de lista en el grupo');if(id){let s=db.students.find(x=>x.id===id);Object.assign(s,{name,number,group})}else db.students.push({id:'ALU-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),name,number,group,created:new Date().toISOString()});save();closeModal();render();toast('Alumno guardado')}
function showStudent(id){selectedStudent=id;currentTab='student';render()}
function studentPage(v){let s=db.students.find(x=>x.id===selectedStudent);if(!s){nav('students');return}let gs=db.grades.filter(g=>g.studentId===s.id&&g.term===db.term);v.innerHTML=`<button class="back" onclick="nav('students')">← Alumnos</button><div class="card"><div class="itemmain"><div class="avatar">${s.number}</div><div><h2 style="margin:0">${esc(s.name)}</h2><div class="muted">${esc(s.group)} · Lista ${s.number}</div></div></div><div class="actions" style="margin-top:14px"><button class="btn small secondary" onclick="studentModal('${s.id}')">Editar</button><button class="btn small" onclick="gradeModal('${s.id}')">＋ Calificar</button><button class="btn small ghost" onclick="showQR('${s.id}')">Ver QR</button><button class="btn small danger" onclick="deleteStudent('${s.id}')">Eliminar</button></div></div><h3>Calificaciones · Trimestre ${db.term}</h3><div class="list">${gs.map(g=>`<div class="item"><div><strong>${esc(activityName(g.activityId))}</strong><small>${new Date(g.date).toLocaleDateString('es-MX')}</small></div><b class="${g.score<6?'grade-low':'grade-ok'}">${g.score.toFixed(2)}</b></div>`).join('')||'<div class="empty">Sin calificaciones registradas en este trimestre.</div>'}</div>`}
function deleteStudent(id){if(confirm('¿Eliminar al alumno? También se eliminarán sus calificaciones.')){db.students=db.students.filter(s=>s.id!==id);db.grades=db.grades.filter(g=>g.studentId!==id);save();nav('students')}}
function activitiesPage(v){v.innerHTML=`<button class="back" onclick="nav('home')">← Inicio</button><div class="sectionhead"><h2>Actividades y tareas</h2><button class="btn small" onclick="activityModal()">＋ Crear</button></div><div class="field"><label>Trimestre</label><select id="termFilter" onchange="renderActivities()"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div><div id="activitylist"></div>`;document.getElementById('termFilter').value=db.term;renderActivities()}
function activityName(id){return db.activities.find(a=>a.id===id)?.name||'Actividad eliminada'}
function renderActivities(){let term=document.getElementById('termFilter')?.value||db.term;let a=db.activities.filter(x=>x.term===term);document.getElementById('activitylist').innerHTML=a.length?`<div class="list">${a.map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><small>${esc(x.group)} · ${esc(x.category)} · ${x.weight}% · Trimestre ${x.term}</small></div><button class="btn small ghost" onclick="activityModal('${x.id}')">Editar</button></div>`).join('')}</div>`:'<div class="empty">No hay actividades para este trimestre.</div>'}
function activityModal(id=''){let a=db.activities.find(x=>x.id===id)||{};modal(`<h3>${id?'Editar actividad':'Nueva actividad'}</h3><div class="field"><label>Nombre</label><input id="aname" value="${esc(a.name||'')}" placeholder="Ej. Cuestionario de electricidad"></div><div class="field"><label>Descripción</label><textarea id="adesc">${esc(a.desc||'')}</textarea></div><div class="row"><div class="field"><label>Grupo</label><select id="agroup">${db.groups.map(g=>`<option ${a.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div><div class="field"><label>Trimestre</label><select id="aterm">${[1,2,3].map(t=>`<option value="${t}" ${(a.term||db.term)==t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Categoría</label><select id="acat">${['Libreta','Tareas','Proyectos','Actividades en clase','Exámenes','Participación'].map(c=>`<option ${a.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Ponderación (%)</label><input id="aw" type="number" min="0" max="100" step=".5" value="${a.weight??10}"></div></div><div class="row"><div class="field"><label>Fecha asignación</label><input id="adate" type="date" value="${a.assign||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Fecha entrega</label><input id="due" type="date" value="${a.due||''}"></div></div><div class="actions"><button class="btn" onclick="saveActivity('${id}')">Guardar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`)}
function saveActivity(id){let name=document.getElementById('aname').value.trim();if(!name)return toast('Escribe el nombre');let o={id:id||'ACT-'+Date.now(),name,desc:document.getElementById('adesc').value,group:document.getElementById('agroup').value,term:document.getElementById('aterm').value,category:document.getElementById('acat').value,weight:Number(document.getElementById('aw').value),assign:document.getElementById('adate').value,due:document.getElementById('due').value};if(o.weight<0||o.weight>100)return toast('La ponderación debe estar entre 0 y 100');if(id)Object.assign(db.activities.find(a=>a.id===id),o);else db.activities.push(o);db.term=o.term;save();closeModal();render();toast('Actividad guardada')}
function gradesPage(v){v.innerHTML=`<button class="back" onclick="nav('home')">← Inicio</button><div class="sectionhead"><h2>Registrar calificaciones</h2><button class="btn small secondary" onclick="nav('scan')">▦ Escanear QR</button></div><div class="field"><label>Grupo</label><select id="gradeGroup" onchange="populateGradeStudents()">${db.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div class="field"><label>Alumno</label><select id="gradeStudent" onchange="populateGradeActivities()"></select></div><div class="field"><label>Actividad</label><select id="gradeActivity"></select></div><div class="field"><label>Calificación (1 a 10)</label><input id="gradeScore" type="number" min="1" max="10" step=".01" placeholder="Ej. 8.5"></div><button class="btn full" onclick="saveGrade()">Guardar calificación</button><div class="notice">Puedes registrar calificaciones escaneando el QR del alumno o seleccionándolo de la lista.</div><h3>Registros recientes</h3><div id="recentGrades"></div>`;populateGradeStudents();renderRecent()}
function populateGradeStudents(){let g=document.getElementById('gradeGroup')?.value;let el=document.getElementById('gradeStudent');if(!el)return;el.innerHTML=db.students.filter(s=>s.group===g).map(s=>`<option value="${s.id}">${esc(s.number+'. '+s.name)}</option>`).join('');populateGradeActivities()}
function populateGradeActivities(){let id=document.getElementById('gradeStudent')?.value,s=db.students.find(x=>x.id===id),el=document.getElementById('gradeActivity');if(!el)return;el.innerHTML=db.activities.filter(a=>a.group===s?.group&&a.term===db.term).map(a=>`<option value="${a.id}">${esc(a.name)} (${a.category})</option>`).join('')}
function saveGrade(){let sid=document.getElementById('gradeStudent').value,aid=document.getElementById('gradeActivity').value,score=Number(document.getElementById('gradeScore').value);if(!sid||!aid)return toast('Selecciona alumno y actividad');if(!Number.isFinite(score)||score<1||score>10)return toast('La calificación debe estar entre 1 y 10');let old=db.grades.find(g=>g.studentId===sid&&g.activityId===aid);if(old){db.history.push({...old,changedAt:new Date().toISOString()});old.score=score;old.date=new Date().toISOString()}else db.grades.push({id:'CAL-'+Date.now(),studentId:sid,activityId:aid,score,term:db.term,date:new Date().toISOString()});save();document.getElementById('gradeScore').value='';renderRecent();toast('Calificación guardada')}
function renderRecent(){let el=document.getElementById('recentGrades');if(!el)return;let a=[...db.grades].reverse().slice(0,8);el.innerHTML=a.length?`<div class="list">${a.map(g=>{let s=db.students.find(x=>x.id===g.studentId);return `<div class="item"><div><strong>${esc(s?.name||'Alumno')}</strong><small>${esc(activityName(g.activityId))}</small></div><b class="${g.score<6?'grade-low':'grade-ok'}">${g.score.toFixed(2)}</b></div>`}).join('')}</div>`:'<div class="empty">Aún no hay calificaciones.</div>'}
function scanPage(v){v.innerHTML=`<button class="back" onclick="nav('home')">← Inicio</button><h2>Escanear código QR</h2><p class="muted">Apunta la cámara al código QR individual del estudiante.</p><div class="notice">La cámara requiere que la aplicación esté abierta mediante una dirección HTTPS y que des permiso de acceso.</div><div class="actions"><button class="btn" onclick="startCamera()">Activar cámara</button><button class="btn ghost" onclick="manualLookup()">Ingresar ID manual</button></div><div id="reader"></div><div id="scanresult"></div>`}
async function startCamera(){let box=document.getElementById('reader');if(!('BarcodeDetector'in window)){toast('Tu navegador no admite lector QR automático. Usa ID manual.');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});box.innerHTML='<video id="cam" autoplay playsinline style="width:100%"></video>';let video=document.getElementById('cam');video.srcObject=stream;let detector=new BarcodeDetector({formats:['qr_code']});let loop=async()=>{if(!stream)return;try{if(video.readyState>=2){let codes=await detector.detect(video);if(codes.length){handleQR(codes[0].rawValue);return}}}catch(e){}requestAnimationFrame(loop)};video.onloadedmetadata=()=>{video.play();loop()}}catch(e){toast('No se pudo abrir la cámara. Revisa los permisos.')}}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function handleQR(raw){stopCamera();let id=String(raw).replace(/^CEF:/,'').trim();let s=db.students.find(x=>x.id===id);let el=document.getElementById('scanresult');if(!el)return;if(!s){el.innerHTML='<div class="empty">Código no reconocido. Verifica que pertenezca a un alumno registrado.</div>';return}selectedStudent=s.id;el.innerHTML=`<div class="card"><div class="itemmain"><div class="avatar">${s.number}</div><div><strong>${esc(s.name)}</strong><small>${esc(s.group)} · Lista ${s.number}</small></div></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="gradeFromScan('${s.id}')">Registrar calificación</button><button class="btn secondary" onclick="showStudent('${s.id}')">Abrir expediente</button></div></div>`}
function gradeFromScan(id){nav('grades');let s=db.students.find(x=>x.id===id);document.getElementById('gradeGroup').value=s.group;populateGradeStudents();document.getElementById('gradeStudent').value=id;populateGradeActivities()}
function manualLookup(){let id=prompt('Escribe el identificador del alumno:');if(id)handleQR(id)}
function showQR(id){let s=db.students.find(x=>x.id===id);modal(`<h3>Código QR del alumno</h3><p><b>${esc(s.name)}</b><br><span class="muted">${esc(s.group)} · Lista ${s.number}</span></p><div class="qrbox"><div id="qrcode"></div><div class="tiny">${esc(s.id)}</div></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="printQR('${s.id}')">Imprimir</button><button class="btn ghost" onclick="closeModal()">Cerrar</button></div><p class="tiny">El QR contiene el identificador único del estudiante.</p>`);setTimeout(()=>{let q=document.getElementById('qrcode');if(window.QRCode)new QRCode(q,{text:s.id,width:190,height:190});else q.innerText='No se pudo cargar el generador QR. Conéctate a internet y vuelve a abrir.'},100)}
function printQR(id){let s=db.students.find(x=>x.id===id);let w=window.open('','_blank');w.document.write(`<html><body style="font-family:Arial;text-align:center;padding:30px"><h2>${esc(s.name)}</h2><p>${esc(s.group)} · Lista ${s.number}</p><div id="qr"></div><p>${s.id}</p><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById('qr'),{text:${JSON.stringify(s.id)},width:220,height:220});setTimeout(()=>window.print(),700)<\/script></body></html>`);w.document.close()}
function reportsPage(v){v.innerHTML=`<button class="back" onclick="nav('home')">← Inicio</button><h2>Reportes trimestrales</h2><div class="row"><div class="field"><label>Grupo</label><select id="reportGroup" onchange="renderReport()"><option value="">Todos</option>${db.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select></div><div class="field"><label>Trimestre</label><select id="reportTerm" onchange="renderReport()">${[1,2,3].map(t=>`<option value="${t}" ${db.term==t?'selected':''}>${t}</option>`).join('')}</select></div></div><div id="reportbody"></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="exportCSV()">Exportar CSV</button><button class="btn secondary" onclick="backup()">Respaldo JSON</button></div>`;renderReport()}
function renderReport(){let g=document.getElementById('reportGroup').value,t=document.getElementById('reportTerm').value;let arr=db.students.filter(s=>!g||s.group===g);let html=arr.map(s=>{let scores=db.grades.filter(x=>x.studentId===s.id&&x.term===t);let avg=scores.length?scores.reduce((a,b)=>a+b.score,0)/scores.length:null;return `<tr><td>${esc(s.name)}</td><td>${esc(s.group)}</td><td>${scores.length}</td><td class="${avg!==null&&avg<6?'grade-low':'grade-ok'}">${avg===null?'—':avg.toFixed(2)}</td></tr>`}).join('');document.getElementById('reportbody').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Alumno</th><th>Grupo</th><th>Actividades</th><th>Promedio simple</th></tr></thead><tbody>${html||'<tr><td colspan="4">Sin alumnos</td></tr>'}</tbody></table></div><p class="tiny">El promedio mostrado es simple de las calificaciones capturadas; la ponderación por categoría se implementará en la siguiente etapa.</p>`}
function exportCSV(){let t=document.getElementById('reportTerm')?.value||db.term,g=document.getElementById('reportGroup')?.value||'';let rows=[['Alumno','Grupo','Actividad','Categoría','Trimestre','Calificación','Fecha']];db.grades.filter(x=>x.term===t).forEach(x=>{let s=db.students.find(z=>z.id===x.studentId),a=db.activities.find(z=>z.id===x.activityId);if(s&&(!g||s.group===g))rows.push([s.name,s.group,a?.name||'',a?.category||'',x.term,x.score,x.date])});let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,`Control_Fisica_T${t}.csv`,'text/csv;charset=utf-8');}
function backup(){download(JSON.stringify(db,null,2),'Respaldo_Control_Escolar_Fisica.json','application/json')}
function settingsPage(v){v.innerHTML=`<button class="back" onclick="nav('home')">← Inicio</button><h2>Configuración y respaldo</h2><div class="card"><div class="field"><label>Trimestre activo</label><select id="activeTerm" onchange="db.term=this.value;save();toast('Trimestre actualizado')">${[1,2,3].map(t=>`<option value="${t}" ${db.term==t?'selected':''}>Trimestre ${t}</option>`).join('')}</select></div><h3>Ponderaciones sugeridas</h3><p class="muted">Configuración inicial. La suma debe ser 100%.</p>${Object.entries(db.weights).map(([k,val],i)=>`<div class="field"><label>${esc(k)} (%)</label><input class="weight" data-key="${esc(k)}" type="number" min="0" max="100" value="${val}"></div>`).join('')}<button class="btn full" onclick="saveWeights()">Guardar ponderaciones</button></div><div class="card" style="margin-top:12px"><h3>Respaldo de datos</h3><p class="muted">Guarda una copia del registro para recuperarlo si cambias de teléfono o borras los datos del navegador.</p><div class="actions"><button class="btn secondary" onclick="backup()">Descargar respaldo</button><button class="btn ghost" onclick="document.getElementById('restorefile').click()">Restaurar respaldo</button><input id="restorefile" type="file" accept=".json,application/json" hidden onchange="restore(event)"></div></div><div class="notice">Los datos se guardan en este dispositivo y navegador. Exporta respaldos regularmente. Si borras los datos del navegador, podrías perderlos.</div>`}
function saveWeights(){let sum=0,obj={};document.querySelectorAll('.weight').forEach(i=>{obj[i.dataset.key]=Number(i.value);sum+=Number(i.value)});if(sum!==100)return toast('Las ponderaciones deben sumar exactamente 100% (actual: '+sum+'%)');db.weights=obj;save();toast('Ponderaciones guardadas')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.students||!x.groups)throw 0;if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){db={...defaults,...x};save();render();toast('Respaldo restaurado')}}catch(e){toast('Archivo de respaldo no válido')}};r.readAsText(f)}
function modal(s){document.getElementById('modalroot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${s}</div></div>`}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
function download(data,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function gradeModal(id){nav('grades');let s=db.students.find(x=>x.id===id);if(!s)return;document.getElementById('gradeGroup').value=s.group;populateGradeStudents();document.getElementById('gradeStudent').value=id;populateGradeActivities()}
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
